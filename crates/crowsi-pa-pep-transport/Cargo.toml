[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-pa-pep-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Versioned local PA-to-PEP composition boundary for Crowsi"
license = "Apache-2.0"
readme = "README.md"
publish = false
repository = "https://github.com/crowsi-net/authorized-execution"

[package.metadata.crowsi]
external-actions = false
software-signing = false
transport = "local-port-only"


[dependencies]
crowsi-control-contracts = { version = "=0.1.0", path = "../crowsi-control-contracts" }
crowsi-enforcement-point = { version = "=0.1.0", path = "../crowsi-enforcement-point" }
crowsi-policy-administrator = { version = "=0.1.0", path = "../crowsi-policy-administrator" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.1"
thiserror = "2.0.18"

[dev-dependencies]
base64 = "0.23.1"
crowsi-policy-engine = { version = "=0.1.0", path = "../crowsi-policy-engine" }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
